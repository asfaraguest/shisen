plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../VERSION')
def currentVersionName = versionFile.exists() ? versionFile.text.trim() : "0.1.0-beta.1"

def semverMatcher = (currentVersionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/)
int computedVersionCode = 10001
if (semverMatcher.matches()) {
    int major = semverMatcher[0][1].toInteger()
    int minor = semverMatcher[0][2].toInteger()
    int patch = semverMatcher[0][3].toInteger()
    def betaGroup = semverMatcher[0][4]
    int beta = betaGroup != null ? betaGroup.toInteger() : 99
    computedVersionCode = (major * 1000000) + (minor * 10000) + (patch * 100) + beta
}

android {
    namespace 'id.menatap.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "id.menatap.app"
        minSdk 24
        targetSdk 34
        versionCode computedVersionCode
        versionName currentVersionName
        buildConfigField "String", "APP_VERSION_NAME", "\"${currentVersionName}\""

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def defaultKs = rootProject.file("keystore/release.jks")
            if (defaultKs.exists()) {
                storeFile defaultKs
                storePassword "tatapsecret2026"
                keyAlias "tatap_release"
                keyPassword "tatapsecret2026"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    packaging {
        resources {
            excludes += [
                'DebugProbesKt.bin'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "release") {
                outputFileName = "shisen-release-v${defaultConfig.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.tukaani:xz:1.9'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
}
