plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../VERSION')
def currentVersionName = versionFile.exists() ? versionFile.text.trim() : "1.0.0"

android {
    namespace 'id.menatap.app'
    compileSdk 34

    defaultConfig {
        applicationId "id.menatap.app"
        minSdk 24
        targetSdk 34
        versionCode 10000
        versionName currentVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            def defaultKs = rootProject.file("keystore/release.jks")
            if (defaultKs.exists()) {
                storeFile defaultKs
                storePassword "tatapsecret2026"
                keyAlias "tatap_release"
                keyPassword "tatapsecret2026"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "release") {
                outputFileName = "menatap-release-v${defaultConfig.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
}
